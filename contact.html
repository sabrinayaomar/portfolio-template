<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Your Name</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header>
    <nav class="container nav">
      <a href="index.html" class="logo">Your <span>Name</span></a>

      <input type="checkbox" id="menu-toggle" aria-label="Toggle menu">
      <label for="menu-toggle" class="menu-icon"><span></span></label>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="articles.html">Articles</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero small">
    <h1>Contact</h1>
    <p>Have a question or an opportunity? Get in touch.</p>
  </section>

  <!-- ================= BODY ================= -->
  <main class="container">
    <div class="contact-layout">

      <section class="card contact-info">
        <h2><span class="icon">📇</span> Details</h2>
        <div class="item">
          <strong>Email</strong>
          <span>your.email@example.com</span>
        </div>
        <div class="item">
          <strong>Phone</strong>
          <span>+000 000 0000</span>
        </div>
        <div class="item">
          <strong>Location</strong>
          <span>City, Country</span>
        </div>
      </section>

      <form class="card form-card" id="contact-form">
        <h3>Send a message</h3>
        <div class="form-row">
          <div>
            <label for="m-name">Name</label>
            <input type="text" id="m-name" required placeholder="Your name">
          </div>
          <div>
            <label for="m-email">Email</label>
            <input type="email" id="m-email" required placeholder="you@example.com">
          </div>
        </div>
        <div class="field">
          <label for="m-subject">Subject</label>
          <input type="text" id="m-subject" placeholder="Subject">
        </div>
        <label for="m-text">Message</label>
        <textarea id="m-text" required placeholder="Write your message..."></textarea>
        <button type="submit" class="btn">Send</button>
        <p class="form-message" id="form-message" hidden>Thank you! Your message has been received.</p>
      </form>

    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer>
    &copy; 2026 Your Name. All rights reserved.
  </footer>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('form-message').hidden = false;
      this.reset();
    });
  </script>
</body>
</html>
